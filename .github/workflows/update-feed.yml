name: Update Ccsumeerut Twitter RSS

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:    # Lets you trigger manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start RSSHub container
        run: |
          docker run -d --name rsshub \
            -p 1200:1200 \
            -e TWITTER_AUTH_TOKEN="${{ secrets.TWITTER_AUTH_TOKEN }}" \
            diygod/rsshub

      - name: Wait for RSSHub to boot
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:1200 > /dev/null; then
              echo "RSSHub is ready"
              break
            fi
            sleep 2
          done

      - name: Fetch and format Ccsumeerut feed
        run: |
          mkdir -p feeds
          curl -f -s "http://localhost:1200/twitter/user/Ccsumeerut/includeRts=0&includeReplies=0&showQuotedInTitle=1?limit=20" -o /tmp/raw.xml

          python3 - << 'EOF'
          import os
          import xml.dom.minidom as minidom

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ.get("GITHUB_REF_NAME", "main")
          public_url = f"https://raw.githubusercontent.com/{repo}/{branch}/feeds/ccsumeerut.xml"

          with open("/tmp/raw.xml", "rb") as f:
              doc = minidom.parse(f)

          # Replace temporary localhost self-link with public GitHub raw URL
          for link in doc.getElementsByTagNameNS("http://www.w3.org/2005/Atom", "link"):
              if link.getAttribute("rel") == "self":
                  link.setAttribute("href", public_url)

          # Wrap item descriptions in CDATA to remove escaped HTML clutter
          for item in doc.getElementsByTagName("item"):
              for desc in item.getElementsByTagName("description"):
                  text = "".join(
                      n.data for n in desc.childNodes
                      if n.nodeType in (n.TEXT_NODE, n.CDATA_SECTION_NODE)
                  ).replace("]]>", "]]&gt;").strip()
                  while desc.firstChild:
                      desc.removeChild(desc.firstChild)
                  desc.appendChild(doc.createCDATASection(text))

          # Remove any pre-existing whitespace-only nodes before pretty-printing
          def strip_ws(node):
              for child in list(node.childNodes):
                  if child.nodeType == child.TEXT_NODE and not child.data.strip():
                      node.removeChild(child)
                  elif child.hasChildNodes():
                      strip_ws(child)

          strip_ws(doc)

          with open("feeds/ccsumeerut.xml", "wb") as f:
              f.write(doc.toprettyxml(indent="  ", encoding="utf-8"))
          EOF

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/ccsumeerut.xml
          git diff --staged -I '<lastBuildDate>' --quiet || (git commit -m "Update Ccsumeerut RSS feed" && git push)
