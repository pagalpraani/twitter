name: Update Twitter RSS Feeds

on:
  schedule:
    - cron: '0 0-15/3 * * *' # 5:30 AM, 8:30 AM, 11:30 AM, 2:30 PM, 5:30 PM, 8:30 PM IST
    - cron: '0 17 * * *'     # Final run at 10:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start RSSHub container
        run: |
          docker run -d --name rsshub \
            -p 1200:1200 \
            -e TWITTER_AUTH_TOKEN="${{ secrets.TWITTER_AUTH_TOKEN }}" \
            diygod/rsshub

      - name: Wait for RSSHub to boot
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:1200 > /dev/null; then
              echo "RSSHub is ready"
              break
            fi
            sleep 2
          done

      - name: Fetch and format feeds
        id: fetch
        run: python3 main.py

      - name: Commit and push updated feeds
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/
          git diff --staged --quiet || (git commit -m "Update Twitter RSS feeds" && git push)
